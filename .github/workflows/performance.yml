name: Performance Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install locust

      - name: Run performance tests
        env:
          LOCUST_HOST: ${{ secrets.LOCUST_HOST }}
        run: |
          locust \
            --headless \
            --users 10 \
            --spawn-rate 2 \
            --run-time 30s \
            --host $LOCUST_HOST \
            --csv=results/locust
      
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-results
          path: results/